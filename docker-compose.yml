# Convenience wrapper: `docker compose up --build`
services:
  nids:
    build: .
    image: nids-pytorch:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    # Mount trained artifacts from the host so you can retrain without
    # rebuilding the image. Comment out if you bake models into the image.
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
